<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111214" />
      <stop offset="100%" stop-color="#1a1d22" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252a" />
      <stop offset="100%" stop-color="#181a1d" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Subway Line Track Bands across background -->
  <path d="M-100,500 C300,520 600,440 1300,480" stroke="#0039A6" stroke-width="6" fill="none" opacity="0.25" />
  <path d="M-100,520 C300,540 600,460 1300,500" stroke="#EE352E" stroke-width="6" fill="none" opacity="0.25" />
  <path d="M-100,540 C300,560 600,480 1300,520" stroke="#00933C" stroke-width="6" fill="none" opacity="0.25" />
  <path d="M-100,560 C300,580 600,500 1300,540" stroke="#FCCC0A" stroke-width="6" fill="none" opacity="0.25" />

  <!-- Left Header & Branding -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect width="190" height="34" rx="17" fill="#0b5cd5" fill-opacity="0.2" stroke="#0b5cd5" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="4" fill="#6fd69a" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fb0ff" letter-spacing="1">NYC TRANSIT AGENT</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1.5">StepFree</text>

    <!-- Tagline -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#6fd69a" letter-spacing="-0.5">The NYC subway without stairs.</text>

    <!-- Description -->
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#a9adb3" width="500">
      <tspan x="0" dy="0">Verified step-free routes that name the working ADA</tspan>
      <tspan x="0" dy="30">elevator your trip depends on at every boarding,</tspan>
      <tspan x="0" dy="30">transfer, and exit—checked against live MTA outage feeds.</tspan>
    </text>

    <!-- Subway Line Bullets Row -->
    <g transform="translate(0, 340)">
      <!-- 1, 2, 3 -->
      <circle cx="20" cy="20" r="18" fill="#EE352E" /><text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
      <circle cx="62" cy="20" r="18" fill="#EE352E" /><text x="62" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
      <circle cx="104" cy="20" r="18" fill="#EE352E" /><text x="104" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
      <!-- 4, 5, 6 -->
      <circle cx="146" cy="20" r="18" fill="#00933C" /><text x="146" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
      <circle cx="188" cy="20" r="18" fill="#00933C" /><text x="188" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
      <circle cx="230" cy="20" r="18" fill="#00933C" /><text x="230" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
      <!-- 7 -->
      <circle cx="272" cy="20" r="18" fill="#B933AD" /><text x="272" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
      <!-- A, C, E -->
      <circle cx="314" cy="20" r="18" fill="#0039A6" /><text x="314" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
      <circle cx="356" cy="20" r="18" fill="#0039A6" /><text x="356" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">C</text>
      <circle cx="398" cy="20" r="18" fill="#0039A6" /><text x="398" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">E</text>
      <!-- L -->
      <circle cx="440" cy="20" r="18" fill="#A7A9AC" /><text x="440" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#000" text-anchor="middle">L</text>
      <!-- Q -->
      <circle cx="482" cy="20" r="18" fill="#FCCC0A" /><text x="482" y="26" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#000" text-anchor="middle">Q</text>
    </g>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(680, 90)" filter="url(#shadow)">
    <!-- Card Container -->
    <rect width="440" height="450" rx="20" fill="url(#cardGrad)" stroke="#34373c" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="24" y="24" width="190" height="26" rx="13" fill="#6fd69a" fill-opacity="0.15" />
    <circle cx="38" cy="37" r="4" fill="#6fd69a" />
    <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#6fd69a">CANDIDATE STEP-FREE ROUTE</text>

    <!-- Route Title -->
    <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">1 Av  →  Times Sq-42 St</text>

    <!-- Leg 1 -->
    <g transform="translate(24, 115)">
      <rect width="392" height="135" rx="12" fill="#111214" stroke="#34373c" stroke-width="1" />
      <!-- Track bar -->
      <rect x="18" y="20" width="4" height="95" rx="2" fill="#A7A9AC" />
      <circle cx="20" cy="20" r="6" fill="#111214" stroke="#A7A9AC" stroke-width="3" />
      <circle cx="20" cy="115" r="6" fill="#A7A9AC" />

      <!-- From Station -->
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1 Av (Manhattan)</text>
      <!-- Elevator Token -->
      <rect x="36" y="35" width="165" height="22" rx="4" fill="#22252a" stroke="#34373c" />
      <text x="44" y="50" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#7fb0ff">🛗 EL292, EL293</text>
      <text x="135" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#6fd69a">WORKING</text>

      <!-- Train Line Badge -->
      <circle cx="48" cy="80" r="11" fill="#A7A9AC" />
      <text x="48" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">L</text>
      <text x="68" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#a9adb3">3 accessible stops on L</text>

      <!-- To Station -->
      <text x="36" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">14 St / 6 Av (Transfer)</text>
    </g>

    <!-- Leg 2 -->
    <g transform="translate(24, 265)">
      <rect width="392" height="135" rx="12" fill="#111214" stroke="#34373c" stroke-width="1" />
      <!-- Track bar -->
      <rect x="18" y="20" width="4" height="95" rx="2" fill="#EE352E" />
      <circle cx="20" cy="20" r="6" fill="#111214" stroke="#EE352E" stroke-width="3" />
      <circle cx="20" cy="115" r="6" fill="#EE352E" />

      <!-- From Station -->
      <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">14 St (Change to 1 train)</text>
      <rect x="36" y="35" width="165" height="22" rx="4" fill="#22252a" stroke="#34373c" />
      <text x="44" y="50" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#7fb0ff">🛗 EL615, EL617</text>
      <text x="135" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#6fd69a">WORKING</text>

      <!-- Train Line Badge -->
      <circle cx="48" cy="80" r="11" fill="#EE352E" />
      <text x="48" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
      <text x="68" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#a9adb3">4 accessible stops on 1</text>

      <!-- To Station -->
      <text x="36" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Times Sq-42 St (Exit EL232)</text>
    </g>

    <!-- Card Footer -->
    <text x="24" y="425" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#a9adb3">Live MTA Data · 397 Accessible Elevators Verified</text>
  </g>
</svg>
